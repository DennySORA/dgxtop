[package]
name = "dgxtop-manager"
description = "dgxtop manager: scheduling, catalog, policy, ingestion, history, configuration, process actions, presentation and sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Inert ports (`dgxtop_manager::testing`) for the suites that assemble a
# Manager.
test-support = ["dgxtop-core/test-support"]

[dependencies]
dgxtop-core.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
dgxtop-core = { workspace = true, features = ["test-support"] }
# Its own integration tests use the inert ports too.
dgxtop-manager = { path = ".", features = ["test-support"] }

[lints]
workspace = true
