<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 485" role="img" aria-labelledby="V2-title V2-desc"><title id="V2-title">多來源溫度的仲裁</title><desc id="V2-desc">合成資料：同 CPU package 的獨立來源 68 和 42 度。先定位與去重，再驗證與比對，結果為衝突而不是平均55度。</desc><defs><marker id="V2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b7cfcf"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#d9e5f5;font-size:16px}.title{font-size:20px;font-weight:700;fill:#a0e5d4}.small{font-size:14px;fill:#a9bbcf}.warn{fill:#ffd399}.label{font-size:14px;fill:#90bddd}.box{fill:#15243b;stroke:#42617d;stroke-width:1.5}.flow{fill:none;stroke:#9bddcc;stroke-width:2.4;marker-end:url(#V2-arrow)}.cmd{fill:none;stroke:#f5cc8e;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#V2-arrow)}a:hover rect{stroke:#defbf3;stroke-width:3}</style><rect x="1" y="1" width="1218" height="483" rx="16" fill="#0d1829" stroke="#2c405b"/><text x="27" y="40" class="title">合成案例：兩個數字，不代表可以取平均</text><rect class="box" x="25" y="75" width="240" height="240" rx="12"/><text class="title" x="42" y="108">① 原始觀測</text><text x="42" y="140" class="small">來源 A：68000 m°C</text><text x="42" y="165" class="small">來源 B：42000 m°C</text><text x="42" y="190" class="small">MetricKey 都是 package:0</text><text x="42" y="215" class="small">已證實是不同 origin</text><text x="42" y="240" class="small">範例採樣時間已對齊</text><rect class="box" x="320" y="75" width="255" height="240" rx="12"/><text class="title" x="337" y="108">② 正規化與驗證</text><text x="337" y="140" class="small">A → 68°C；B → 42°C</text><text x="337" y="165" class="small">核對單位、scope、driver fault</text><text x="337" y="190" class="small">排除未知、逾時與模擬混流</text><text x="337" y="215" class="small">來源別名去重，不當多票</text><text x="337" y="240" class="small">不同 scope：改為分別顯示</text><rect class="box" x="630" y="75" width="255" height="240" rx="12"/><text class="title" x="647" y="108">③ 比對與選擇</text><text x="647" y="140" class="small">兩來源都有效且同級</text><text x="647" y="165" class="small">差距 26°C &gt; 例示容差 8°C</text><text x="647" y="190" class="small">標示 SOURCE_DISAGREEMENT</text><text x="647" y="215" class="small">不以較低溫當比較正確</text><text x="647" y="240" class="small">不把 pin 當忽略衝突的權限</text><rect class="box" x="940" y="75" width="255" height="240" rx="12"/><text class="title" x="957" y="108">④ 可解釋結果</text><text x="957" y="140" class="small">selection_state = conflict</text><text x="957" y="165" class="small">value = null</text><text x="957" y="190" class="small">保留 A／B 及完整理由</text><text x="957" y="215" class="small">UI 顯示衝突，非 55°C</text><text x="957" y="240" class="small">此段不進正常歷史平均</text><path class="flow" d="M265 190H318"/><path class="flow" d="M575 190H628"/><path class="flow" d="M885 190H938"/><text x="30" y="367" class="warn">容差是可調工程預設，不是通用的「真／假感測器」分界。</text><text x="30" y="401" class="small">讀值長期不變、來源相關性低、或來源彼此不一致，都不單獨構成「造假」證明。</text><text x="30" y="435" class="small">若 B 是 SoC 而非 CPU package，68°C 與 42°C 應同時保留為不同指標，不進入同一場仲裁。</text></svg>