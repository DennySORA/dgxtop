<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" role="img" aria-labelledby="V4-title V4-desc"><title id="V4-title">有界執行與故障隔離</title><desc id="V4-desc">七個liveAdapter常駐host，固定計算池，32批與8MiB ingress，Manager公平控制，HotStore有限歷史，Viewer只收最新投影。Audit必須持久化才允許Action；所有數字為設計預算。</desc><defs><marker id="V4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9cdaca"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#dce7f3;font-size:16px}.v4title{font-size:20px;font-weight:700;fill:#a0e4d3}.v4sub{font-size:14px;fill:#adc0d3}.v4box{fill:#172b40;stroke:#466882;stroke-width:1.5}.v4flow{fill:none;stroke:#9cdaca;stroke-width:2.2;marker-end:url(#V4-arrow)}.v4cmd{fill:none;stroke:#e4c084;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#V4-arrow)}</style><rect x="1" y="1" width="1218" height="758" rx="16" fill="#0d1829" stroke="#29425c"/><text x="27" y="38" class="v4title">執行隔離，不是增加無限平行工作</text><text x="28" y="64" class="v4sub">設計上限／目標 · 實線：資料與結果　虛線：控制與授權</text><rect x="22" y="91" width="282" height="380" rx="13" fill="#101d2f" stroke="#577994" stroke-dasharray="6 5"/><text x="41" y="123" class="v4title">受管常駐 Adapter host</text><text x="41" y="152" class="v4sub">每host一個在途；硬上限8個</text><rect x="40" y="175" width="247" height="55" rx="9" class="v4box"/><text x="53" y="208">Procfs／Hwmon／Thermal</text><rect x="40" y="243" width="247" height="55" rx="9" class="v4box"/><text x="53" y="276">Powercap／Net／Filesystem</text><rect x="40" y="311" width="247" height="67" rx="9" fill="#382a31" stroke="#af8789"/><text x="53" y="340">NVML 卡住 → 該host不可用</text><text x="53" y="361" class="v4sub">其他backend不跟著等待</text><text x="41" y="411" class="v4sub">timeout ≠ 底層呼叫已取消</text><text x="41" y="438" class="v4sub">未reap → quarantine，不無限重啟</text><rect x="360" y="99" width="253" height="151" rx="12" class="v4box"/><text x="379" y="132" class="v4title">Broker＋固定CPU池</text><text x="379" y="163">2 workers／最多8 jobs</text><text x="379" y="190" class="v4sub">相同read group同輪只讀一次</text><text x="379" y="218" class="v4sub">Collector純計算，沒有driver I/O</text><rect x="360" y="293" width="253" height="143" rx="12" class="v4box"/><text x="379" y="326" class="v4title">Ingress 雙配額</text><text x="379" y="358">32 batches ＋ 8 MiB</text><text x="379" y="385" class="v4sub">wire ≤1MiB；decode ≤4MiB</text><text x="379" y="412" class="v4sub">配置之前先保留byte credit</text><path d="M305 200H355" class="v4flow"/><path d="M485 252V287" class="v4flow"/><rect x="670" y="100" width="250" height="184" rx="12" class="v4box"/><text x="689" y="133" class="v4title">Manager 控制迴圈</text><text x="689" y="164">2ms slice，公平輪詢</text><text x="689" y="192" class="v4sub">command ≤128／reply先reserve</text><text x="689" y="220" class="v4sub">不等待DB、driver或terminal</text><text x="689" y="247" class="v4sub">epoch與late reply先驗證</text><path d="M614 363H641V214H664" class="v4flow"/><rect x="967" y="100" width="228" height="184" rx="12" class="v4box"/><text x="985" y="133" class="v4title">HotStore／History</text><text x="985" y="164">單寫／有界chunks</text><text x="985" y="192" class="v4sub">300s raw／24h minute</text><text x="985" y="220" class="v4sub">查詢最多2 workers</text><text x="985" y="247" class="v4sub">≤2000點／4MiB result</text><path d="M922 161H961" class="v4flow"/><path d="M967 246H925" class="v4flow"/><rect x="670" y="338" width="525" height="132" rx="12" class="v4box"/><text x="689" y="371" class="v4title">Viewer／Controller：不等採樣或磁碟</text><text x="689" y="402">latest-only：1 pending ＋ 1 active／session</text><text x="689" y="432" class="v4sub">dirty-only 4fps；非阻塞terminal；慢讀不累積frames</text><path d="M817 286V332" class="v4flow"/><path d="M714 337V290" class="v4cmd"/><path d="M360 144H326V78H771V97" class="v4cmd"/><path d="M20 500H1200" stroke="#37516d" stroke-dasharray="5 5"/><text x="29" y="531" class="v4title">持久化與副作用：單獨排程，不省略安全</text><rect x="29" y="551" width="315" height="114" rx="12" class="v4box"/><text x="48" y="582">Archive：預設關閉／有界批次</text><text x="48" y="610" class="v4sub">WAL NORMAL；失敗顯示未存檔</text><text x="48" y="638" class="v4sub">不阻塞即時採樣／HotStore</text><rect x="392" y="551" width="377" height="114" rx="12" class="v4box"/><text x="411" y="582">Audit：WAL FULL＋durable intent</text><text x="411" y="610" class="v4sub">晚到ACK仍重核TTL／取消／policy</text><text x="411" y="638" class="v4sub">拒絕／未知不可當成功、自動重送</text><rect x="817" y="551" width="378" height="114" rx="12" fill="#24372e" stroke="#689781"/><text x="836" y="582">ProcessActionAdapter → held pidfd</text><text x="836" y="610" class="v4sub">只執行Manager明確核准的動作</text><text x="836" y="638" class="v4sub">signal_sent ≠ exit_observed</text><path d="M773 593H811" class="v4cmd"/><text x="28" y="709" class="v4title">全域受管資料 256 MiB；程序樹RSS目標 ≤384 MiB</text><text x="28" y="737" class="v4sub">catalog 24＋raw候選32＋hot16＋raw history32＋aggregate96＋ingress8＋presentation12＋query16＋reserve20</text></svg>
