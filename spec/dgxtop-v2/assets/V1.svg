<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 850" role="img" aria-labelledby="V1-title V1-desc"><title id="V1-title">六元件與兩條路徑</title><desc id="V1-desc">實線為資料，虛線為控制。Manager 唯一持有 StoreWriter 與 ActionPort；Viewer 和 Controller 不越過資料與控制邊界。</desc><defs><marker id="V1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b7cfcf"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#d9e5f5;font-size:16px}.title{font-size:20px;font-weight:700;fill:#a0e5d4}.small{font-size:14px;fill:#a9bbcf}.warn{fill:#ffd399}.label{font-size:14px;fill:#90bddd}.box{fill:#15243b;stroke:#42617d;stroke-width:1.5}.flow{fill:none;stroke:#9bddcc;stroke-width:2.4;marker-end:url(#V1-arrow)}.cmd{fill:none;stroke:#f5cc8e;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#V1-arrow)}a:hover rect{stroke:#defbf3;stroke-width:3}</style><rect x="1" y="1" width="1218" height="848" rx="16" fill="#0d1829" stroke="#2c405b"/><text x="28" y="39" class="title">資料平面：觀測不等於權威值</text><text x="720" y="39" class="small">實線＝資料／結果　虛線＝命令／排程</text><rect class="box" x="25" y="115" width="150" height="160" rx="12"/><text class="title" x="42" y="148">外部來源</text><text x="42" y="180" class="small">Linux／驅動</text><text x="42" y="205" class="small">NVML／proc</text><text x="42" y="230" class="small">hwmon／thermal</text><a href="#B1" data-jump="B1"><rect class="box" x="220" y="115" width="190" height="160" rx="12"/><text class="title" x="237" y="148">Adapter</text><text x="237" y="180" class="small">接入 API、來源識別</text><text x="237" y="205" class="small">保留原始值與錯誤</text><text x="237" y="230" class="small">唯讀 TelemetryPort</text></a><a href="#B2" data-jump="B2"><rect class="box" x="465" y="115" width="240" height="160" rx="12"/><text class="title" x="482" y="148">Collector</text><text x="482" y="180" class="small">語意／單位／品質驗證</text><text x="482" y="205" class="small">同源去重、多來源仲裁</text><text x="482" y="230" class="small">產生標準值與解釋</text></a><a href="#B3" data-jump="B3"><rect class="box" x="760" y="105" width="225" height="180" rx="12"/><text class="title" x="777" y="138">Manager</text><text x="777" y="170" class="small">排程、政策、命令授權</text><text x="777" y="195" class="small">資料提交與歷史查詢</text><text x="777" y="220" class="small">模組生命週期／投影</text><text x="777" y="245" class="small">不是所有邏輯的大物件</text></a><a href="#B4" data-jump="B4"><rect class="box" x="1030" y="115" width="165" height="160" rx="12"/><text class="title" x="1047" y="148">Store</text><text x="1047" y="180" class="small">快照、候選、歷史</text><text x="1047" y="205" class="small">設定與動作稽核</text><text x="1047" y="230" class="small">不判斷採信來源</text></a><path class="flow" d="M175 195H218"/><path class="flow" d="M410 195H463"/><path class="flow" d="M705 195H758"/><path class="flow" d="M985 180H1028"/><text class="label" x="221" y="301">ObservationBatch</text><text class="label" x="485" y="301">CollectionBatch</text><text class="label" x="984" y="162">提交</text><path class="flow" d="M1110 277V337H930V287"/><text class="label" x="1010" y="330">Reader 結果</text><path class="cmd" d="M810 104V73H313V112"/><text class="label" x="435" y="65">Manager 決定頻率；Collector 經 broker 讀取</text><path d="M20 365H1200" stroke="#3a4d65" stroke-dasharray="5 5"/><text x="27" y="398" class="title">介面平面：輸入與渲染分開</text><rect class="box" x="25" y="440" width="250" height="132" rx="12"/><text class="title" x="42" y="473">使用者</text><text x="42" y="505" class="small">按鍵／滑鼠／CLI</text><text x="42" y="530" class="small">不直接取得驅動或 Store</text><a href="#B6" data-jump="B6"><rect class="box" x="340" y="440" width="350" height="132" rx="12"/><text class="title" x="357" y="473">Controller</text><text x="357" y="505" class="small">情境、焦點、按鍵映射 → typed Command</text><text x="357" y="530" class="small">使用穩定 ProcessKey，不使用 row index</text></a><a href="#B5" data-jump="B5"><rect class="box" x="760" y="440" width="435" height="132" rx="12"/><text class="title" x="777" y="473">Viewer</text><text x="777" y="505" class="small">不可變 ViewModel → Layout → DisplayModule → Frame</text><text x="777" y="530" class="small">可擴充模組；不採樣、不寫 Store、不發訊號</text></a><path class="flow" d="M275 500H338"/><path class="cmd" d="M690 485H731V246H758"/><text class="label" x="466" y="427">Command → Manager</text><path class="flow" d="M858 286V438"/><text class="label" x="872" y="385">不可變 ViewModel／QueryResult</text><path class="flow" d="M805 574V610H630V574"/><text class="label" x="727" y="630">Frame revision＋HitMap</text><text x="27" y="650" class="title">動作平面：只有明確授權後才能產生副作用</text><rect class="box" x="25" y="680" width="250" height="130" rx="12"/><text class="title" x="42" y="713">外部程序</text><text x="42" y="745" class="small">穩定程序 fd 指向的目標</text><text x="42" y="770" class="small">SIGTERM 不可回滾</text><rect class="box" x="340" y="680" width="350" height="130" rx="12"/><text class="title" x="357" y="713">ProcessActionAdapter</text><text x="357" y="745" class="small">只接受 Manager ProcessService 的操作</text><text x="357" y="770" class="small">與 TelemetryPort 分離；不暴露給 Collector</text><path class="cmd" d="M985 253H1210V745H692"/><text class="label" x="780" y="732">授權＋確認＋durable audit intent</text><path class="cmd" d="M340 743H277"/></svg>