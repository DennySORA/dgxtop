<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" role="img" aria-labelledby="V3-title V3-desc"><title id="V3-title">程序動作的兩階段確認</title><desc id="V3-desc">Prepare不送訊號；確認後仍需同session政策和身分檢查、可持久稽核，再以held pidfd送出訊號。未知結果不自動重試。</desc><defs><marker id="V3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b7cfcf"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#d9e5f5;font-size:16px}.title{font-size:20px;font-weight:700;fill:#a0e5d4}.small{font-size:14px;fill:#a9bbcf}.warn{fill:#ffd399}.label{font-size:14px;fill:#90bddd}.box{fill:#15243b;stroke:#42617d;stroke-width:1.5}.flow{fill:none;stroke:#9bddcc;stroke-width:2.4;marker-end:url(#V3-arrow)}.cmd{fill:none;stroke:#f5cc8e;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#V3-arrow)}a:hover rect{stroke:#defbf3;stroke-width:3}</style><rect x="1" y="1" width="1218" height="658" rx="16" fill="#0d1829" stroke="#2c405b"/><text x="26" y="39" class="title">程序控制保留；安全邊界集中在 Manager</text><rect class="box" x="25" y="78" width="255" height="150" rx="12"/><text class="title" x="42" y="111">① Controller</text><text x="42" y="143" class="small">選取穩定 ProcessKey</text><text x="42" y="168" class="small">送 PrepareSignal</text><rect class="box" x="330" y="78" width="255" height="150" rx="12"/><text class="title" x="347" y="111">② ProcessService</text><text x="347" y="143" class="small">檢查 UID／能力／namespace</text><text x="347" y="168" class="small">不是 UI 說可以就可以</text><rect class="box" x="635" y="78" width="255" height="150" rx="12"/><text class="title" x="652" y="111">③ Action Adapter</text><text x="652" y="143" class="small">開啟 pidfd，重核原身分</text><text x="652" y="168" class="small">持有 handle，不重新以 PID 找</text><rect class="box" x="940" y="78" width="255" height="150" rx="12"/><text class="title" x="957" y="111">④ Viewer＋Controller</text><text x="957" y="143" class="small">顯示目標、signal 與風險</text><text x="957" y="168" class="small">10 秒一次性確認 token</text><path class="cmd" d="M280 150H328"/><path class="cmd" d="M585 150H633"/><path class="cmd" d="M890 150H938"/><path class="cmd" d="M1070 230V303"/><rect class="box" x="940" y="305" width="255" height="150" rx="12"/><text class="title" x="957" y="338">⑤ Manager 再驗證</text><text x="957" y="370" class="small">same session、TTL、政策未改</text><text x="957" y="395" class="small">原子鎖定token；身分仍符合</text><rect class="box" x="635" y="305" width="255" height="150" rx="12"/><text class="title" x="652" y="338">⑥ AuditStore</text><text x="652" y="370" class="small">先可靠提交 action intent</text><text x="652" y="395" class="small">寫不成功＝不送 signal</text><rect class="box" x="330" y="305" width="255" height="150" rx="12"/><text class="title" x="347" y="338">⑦ Action Adapter</text><text x="347" y="370" class="small">重核取消／TTL，再用held pidfd</text><text x="347" y="395" class="small">送出不等於已退出</text><rect class="box" x="25" y="305" width="255" height="150" rx="12"/><text class="title" x="42" y="338">⑧ Store → Viewer</text><text x="42" y="370" class="small">signal_sent／exit_observed</text><text x="42" y="395" class="small">崩潰不明 → unknown，不重試</text><path class="cmd" d="M940 380H892"/><path class="cmd" d="M635 380H587"/><path class="cmd" d="M330 380H282"/><rect x="25" y="497" width="1170" height="130" rx="12" fill="#302536" stroke="#b08091"/><text x="46" y="531" class="warn">任何一關不符合：拒絕、取消或過期，不退回 kill(PID)。</text><text x="46" y="565" class="small">預設只有同 UID、非 root session 的明確 SIGTERM；SIGKILL 要另啟用且另外確認。</text><text x="46" y="596" class="small">這是設計狀態圖，不是本環境已送訊號或驗證真實 PID 重用的紀錄。</text></svg>