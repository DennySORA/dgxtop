name: Release

# Runs only when a maintainer pushes a version tag. The release is created as a
# draft; a maintainer publishes it after checking its assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Tag must equal the workspace package version
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dgxtop"))')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v${version}"; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo metadata --format-version 1 --locked > metadata.json
      - run: python3 spec/dgxtop-v2/tools/check_boundaries.py metadata.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_validation.py
      # Declared licenses of the locked dependencies, for the SBOM.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-metadata
          path: metadata.json

  build:
    name: build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          # GNU targets only: musl builds are not produced because NVML is untested
          # there, and the installer never falls back from GNU to musl. Ubuntu
          # 22.04 images keep the required glibc at 2.35 at most.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify the artifact reports the tag, target and SQLite runtime
        run: |
          bin="target/${{ matrix.target }}/release/dgxtop"
          "$bin" --version --verbose | tee version.txt
          grep -qxF "dgxtop ${GITHUB_REF_NAME#v}" version.txt
          grep -qxF "target: ${{ matrix.target }}" version.txt
          grep -qE '^sqlite: [0-9]+(\.[0-9]+)+ \(runtime gate >= 3\.51\.3: ok\)$' version.txt
      - name: The binary needs glibc 2.35 at most
        run: |
          required="$(objdump -p "target/${{ matrix.target }}/release/dgxtop" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "highest glibc version required: ${required}"
          test "$(printf '%s\n' "${required}" 2.35 | sort -V | tail -n 1)" = 2.35
      - name: Package
        run: |
          name="dgxtop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "${name}.tar.gz" dgxtop
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: The archive installs with install.sh
        run: |
          mkdir -p smoke
          cp "dgxtop-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" smoke/
          (cd smoke && sha256sum dgxtop-*.tar.gz > SHA256SUMS)
          ./install.sh --version "${GITHUB_REF_NAME}" --base-url "file://${PWD}/smoke" --install-dir "${RUNNER_TEMP}/bin"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dgxtop-*.tar.gz
            dgxtop-*.tar.gz.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and SBOM
        run: |
          cd dist
          sha256sum dgxtop-*.tar.gz > SHA256SUMS
          python3 ../scripts/sbom.py ../Cargo.lock "${GITHUB_REF_NAME}" metadata.json > "dgxtop-${GITHUB_REF_NAME}.cdx.json"
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: |
            dgxtop for Linux on x86_64 and aarch64 with glibc 2.35 or newer; WSL 2 runs the Linux build.
            Install: curl -fsSL https://raw.githubusercontent.com/DennySORA/dgxtop/main/install.sh | bash
            Hardware validation status, test evidence and known gaps: see docs/validation/VALIDATION.md.
            A platform is only "validated" when that document lists measured evidence for it.
          files: |
            dist/dgxtop-*.tar.gz
            dist/SHA256SUMS
            dist/dgxtop-*.cdx.json
